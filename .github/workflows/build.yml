name: build-cv

on:
    workflow_dispatch:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            - name: install xelatex
              run: |
                sudo apt-get update && sudo apt-get upgrade -y && \
                sudo apt-get install -y --no-install-recommends \
                texlive-xetex
            - uses: prefix-dev/setup-pixi@v0.10.1
              with:
                pixi-version: v0.66.0
                cache: true
                activate-environment: true
            - name: render w/ snakemake
              run: |
                snakemake -s workflow/Snakemake --cores 1 --forceall
            - name: git
              run: |
                if [! -f docs/vitae_KLS.pdf ]; then
                    echo "File Missing: docs/vitae_KLS.pdf"
                    exit 1
                fi
                if [! -f docs/sound.pdf ]; then
                    echo "Fill missing: docs/sound.pdf"
                    exit 1
                fi
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add .
                git commit -m "🤖 build CV"
                git push
