name: build-cv

on:
    workflow_dispatch:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            - name: Testing
              uses: snakemake/snakemake-github-action@v2
              with:
                directory: "."
                snakefile: "workflow/Snakefile"
                snakemake-version: "7.32.4"
                args: "--cores 1 --use-conda --conda-frontend conda"
                show-disk-usage-on-error: true
            - name: git
              run: |
                if [! -f docs/vitae_KLS.pdf ]; then
                    echo "File Missing: docs/vitae_KLS.pdf"
                    exit 1
                fi
                if [! -f docs/sound.pdf ]; then
                    echo "Fill missing: docs/sound.pdf"
                    exit 1
                fi
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add .
                git commit -m "🤖 build CV"
                git push
