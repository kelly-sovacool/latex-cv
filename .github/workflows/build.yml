name: build-cv

on:
    workflow_dispatch:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            - name: install xelatex
              run: |
                sudo apt-get update && sudo apt-get upgrade -y && \
                sudo apt-get install -y --no-install-recommends \
                texlive-xetex texlive-fonts-extra texlive-fonts-recommended
            - uses: prefix-dev/setup-pixi@v0.10.1
              with:
                pixi-version: v0.76.1
                cache: false
                activate-environment: true
            - name: render w/ snakemake
              run: |
                snakemake --cores 1 --forceall
            - name: git
              run: |
                for filename in docs/vitae_KLS.pdf docs/sound.pdf; do
                    if [ ! -f $filename ]; then
                        echo "File Missing: $filename"
                        exit 1
                    fi
                done
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add .
                git commit -m "🤖 build CV"
                git push
